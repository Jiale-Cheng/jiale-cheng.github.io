<!DOCTYPE html>
<html lang="en">
   <head>
      {% include head.html %}
      <!-- main style sheet -->  
      <link rel="stylesheet" href="{{ '/assets/css/home.css' | relative_url }}">
      <link rel="stylesheet" href="{{ '/assets/css/footer.css' | relative_url }}">
      <link rel="stylesheet" href="{{ '/assets/css/site-nav.css' | relative_url }}">
      <!-- font awesome --> 
      <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.3.1/css/all.css">
      <!-- google font-->
      <link href="https://fonts.googleapis.com/css?family=Montserrat|Source+Sans+Pro|Ubuntu+Mono" rel="stylesheet">
      <!-- --> 
   </head>
   <body class="home-body">
      {% include blog-nav.html active='home' overlay=true %}
      <div id="particles-js">
         <div class="home-planet-clock" data-planet-clock role="img" aria-label="Mars with a rover">
            <img class="home-planet-clock__planet" data-planet-image data-mars-src="{{ '/about/Mars.png' | relative_url }}" data-moon-src="{{ '/about/Moon.png' | relative_url }}" src="{{ '/about/Mars.png' | relative_url }}" width="553" height="553" alt="" aria-hidden="true">
            <div class="home-planet-clock__orbit" data-rover-orbit aria-hidden="true">
               <svg class="home-planet-clock__rover" viewBox="0 0 120 70" focusable="false" aria-hidden="true">
                  <path d="M13 49h8l7-20 26-4 9-16h22l11 19 14 5 5 16z" fill="#f7f8fa" stroke="#dce4e8" stroke-width="2" stroke-linejoin="round"/>
                  <path d="M66 13h16l8 15H58z" fill="#5d6d78"/>
                  <path d="M43 27 37 12m-6 0h13" fill="none" stroke="#f7f8fa" stroke-width="4" stroke-linecap="round"/>
                  <path d="M22 48h90" fill="none" stroke="#f7f8fa" stroke-width="5" stroke-linecap="round"/>
                  <circle cx="34" cy="54" r="10" fill="#1a222c" stroke="#f7f8fa" stroke-width="4"/>
                  <circle cx="92" cy="54" r="10" fill="#1a222c" stroke="#f7f8fa" stroke-width="4"/>
                  <circle cx="34" cy="54" r="3" fill="#aebbc3"/>
                  <circle cx="92" cy="54" r="3" fill="#aebbc3"/>
               </svg>
            </div>
         </div>
         <div class="header">
            <h1 class="site-title">Welcome to Jiale's Blog</h1>
         </div>
         <a class="down" href="#about" data-scroll><i class="icon fas fa-chevron-down fa-lg" aria-hidden="true" style="z-index: 2;"></i></a>
      </div>
      <section id="about">
         <div class="lower" id="main-content">
            {{ content }}
         </div >
      </section>
      <script src="{{ '/assets/js/particles.min.js' | relative_url }}"></script>
      <script src="{{ '/assets/js/particles_conf.js' | relative_url }}"></script>
      <script src="{{ '/assets/js/rover-clock.js' | relative_url }}"></script>
      <script src="{{ '/assets/js/rover-fact.js' | relative_url }}"></script>
      {% if site.mapmyvisitors.enabled and site.mapmyvisitors.widget_id %}<script src="{{ '/assets/js/visitor-map.js?v=2' | relative_url }}"></script>{% endif %}
      {% include footer.html analytics=false %}
      <script src="{{ '/assets/js/blog-nav.js' | relative_url }}"></script>
   </body>
</html>
