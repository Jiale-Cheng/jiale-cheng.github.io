<!DOCTYPE html>
<html lang="en">
   <head>
      {% include head.html %}
      <!-- main style sheet -->  
      <link rel="stylesheet" href="{{ '/assets/css/home.css' | relative_url }}">
      <!-- font awesome --> 
      <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.3.1/css/all.css">
      <!-- google font-->
      <link href="https://fonts.googleapis.com/css?family=Montserrat|Source+Sans+Pro|Ubuntu+Mono" rel="stylesheet">
      <!-- --> 
   </head>
   <body>
      <div id="particles-js" style="background-image: url('{{ '/about/Mars.png' | relative_url }}');background-size: 20%;background-repeat: no-repeat;background-position: 80% 20%;">
         <div class="header">
            <h1>
               <span class="site-title">{{site.title}}</span>
               <span class="site-description">{{site.description}}</span>
            </h1>
            <div class="header-links">
               <a class="link" href="{{ '/blog/' | relative_url }}">Posts</a>
               <!-- <a class="link" href="/repo" >Codes</a> -->
               <a class="link" href="{{ '/about/' | relative_url }}">About</a>
            </div>
         </div>
         <a class="down" href="#about" data-scroll><i class="icon fas fa-chevron-down fa-lg" aria-hidden="true" style="z-index: 2;"></i></a>
      </div>
      <section id="about">
         <div class="lower">
            {{ content }}
         </div >
      </section>
      <script src="{{ '/assets/js/particles.min.js' | relative_url }}"></script>
      <script src="{{ '/assets/js/particles_conf.js' | relative_url }}"></script>
      {% include footer.html analytics=false %}
   </body>
</html>
