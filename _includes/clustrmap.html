{% if include.style == "js" %}
<script type="text/javascript" id="clustrmaps" src="https://clustrmaps.com/map_v2.js?d={{ site.author.clustrmap }}&cl=ffffff&w=a"></script>
<noscript>
  <style>.home-analytics.is-pending{position:static;visibility:visible;pointer-events:auto}</style>
  <img src="https://www.clustrmaps.com/map_v2.png?d={{ site.author.clustrmap }}&cl=ffffff" alt="Visitor map">
</noscript>
{% elsif include.style == "hiddenpng" %}  
<div hidden class="analytics" aria-hidden="true">
	 <img src="https://www.clustrmaps.com/map_v2.png?d={{ site.author.clustrmap }}&cl=ffffff" alt="">
</div>
{% else %}
	 <img src="https://www.clustrmaps.com/map_v2.png?d={{ site.author.clustrmap }}&cl=ffffff" alt="Visitor map">
{% endif %}
