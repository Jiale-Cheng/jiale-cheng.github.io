# markdown
markdown: kramdown

future: false
  
kramdown:
 math_engine: mathjax
 footnote_nr: 1
 entity_output: as_char
 # Jekyll 3 and GitHub Pages now only support rouge for syntax highlighting
 syntax_highlighter: rouge
 syntax_highlighter_opts:
  # Use existing pygments syntax highlighting css
  css_class: 'highlight'
 span:
  line_numbers: false
 block:
  line_numbers: true
  start_line: 1
 
highlighter: rouge
    
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  
permalink: /:year/:title/

defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      toc: true
      mathjax: true
      mermaid: false
      highlight: false
      numbering: true
      status: Completed
      protected: false
      commentable: true
      rss: true

exclude:
 - LICENSE.md
 - README.md
 - "*.cdf"
 - "*.tex"
 - "*.aux"
 - "*.log"
 - "*.out"
 - "*.gz"
 - "*.toc"
 - "*.bib"
 - "*.nb"
 - "*.bk"
 - "*.draft.md"
 - "*.source.*"
 - _posts/2018-06-06-Lie-group-and-Lie-algebra-cn/2018-06-06-Lie-group-and-Lie-algebra-cn_source.md
 - _posts/2023-3-1-ZFC-Framework-of-Axioms/2023-3-1-ZFC-Framework-of-Axioms_tmp.html
